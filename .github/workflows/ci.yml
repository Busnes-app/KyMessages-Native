name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep default-branch verification complete; superseded pull request runs may cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: "26"

jobs:
  go:
    name: Go build, vet & tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Proxy compose overlay
        run: bash scripts/check-compose-proxy.sh

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...

      - name: Tests with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

      # Bounded fuzzing, roughly 10-20 s per target. Minimising a new input may take the
      # default 60 s and stalls the exec count meanwhile, so it is capped at 5 s.
      - run: go test -fuzz=FuzzClientIP -fuzztime=200000x -fuzzminimizetime=5s ./internal/auth
      - run: go test -fuzz=FuzzParseTrustedProxies -fuzztime=600000x -fuzzminimizetime=5s ./internal/config
      - run: go test -fuzz=FuzzValidateName -fuzztime=400000x -fuzzminimizetime=5s ./internal/branding
      - run: go test -fuzz=FuzzNormalizePNG -fuzztime=50000x -fuzzminimizetime=5s ./internal/branding

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore

  postgres:
    name: Go tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      # Same suite, real Postgres: each test gets its own schema (internal/testdb).
      - name: Tests against PostgreSQL
        env:
          KY_TEST_POSTGRES_DSN: postgres://ci:ci@127.0.0.1:5432/ci_test?sslmode=disable
        run: go test -race -count=1 ./...

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Tests
        run: npm test
        working-directory: web

      - name: Typecheck and build
        run: npm run build
        working-directory: web

      # web/dist is embedded into the Go binary, so a stale commit ships a stale UI. Status, not
      # diff: a new hashed bundle is an untracked file, which git diff never reports.
      - name: Committed web/dist matches source
        run: |
          dirty="$(git status --porcelain -- web/dist)"
          if [ -n "$dirty" ]; then printf '%s\n' "$dirty"; exit 1; fi

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: web

  browser:
    name: Browser regressions (production server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go build -o .browser/server ./cmd/server
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: web/test-results/
          retention-days: 7

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      - run: shellcheck scripts/*.sh
      - run: go build -o kymessages ./cmd/server
      - run: scripts/smoke-test.sh
      - run: python3 scripts/backup-acceptance.py

  docker:
    name: Docker image build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t kymessages:ci .

      - name: Container serves the app
        run: |
          docker run -d --name ky_ci -p 18080:8080 \
            -e KY_ADMIN_PASSWORD='CiSmokeAdminPass123!' \
            -e KY_CAPTCHA_PROVIDER=none \
            kymessages:ci
          trap 'docker logs ky_ci; docker rm -f ky_ci' EXIT

          curl -sf -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/
          curl -sf -o /dev/null http://127.0.0.1:18080/api/settings
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CiSmokeAdminPass123!"}' \
            http://127.0.0.1:18080/api/auth/login | grep -q '"authenticated":true'
