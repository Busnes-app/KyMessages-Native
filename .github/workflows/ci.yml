name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep default-branch verification complete; superseded pull request runs may cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: "26"
  KY_PUSH_ENABLED: "false"
  PUSH_RELAY_URL: ""
  APNS_RELAY_URL: ""

jobs:
  go:
    name: Go build, vet & tests (SQLite)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Proxy compose overlay
        run: bash scripts/check-compose-proxy.sh

      - name: Release gate names every CI job
        run: bash scripts/check-release-required.sh

      # Only a -tags kye2e build may start in multi mode (internal/config/gate_kye2e.go).
      - name: kye2e tag stays out of release builds
        run: bash scripts/check-build-tags.sh

      - name: Post-quantum hybrid TLS guard
        run: bash scripts/check-pqc-tls.sh

      - name: kye2e build opens the gate only for a .test issuer
        run: |
          go vet -tags kye2e ./internal/config/
          go test -tags kye2e -run '^TestBuildGate|^TestTenancyModeFromEnv/unavailable/' ./internal/config/

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...

      - name: Tests with race detector and coverage
        run: go test -race -timeout=30m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

      # Bounded fuzzing, roughly 10-20 s per target. Minimising a new input may take the
      # default 60 s and stalls the exec count meanwhile, so it is capped at 5 s.
      - run: go test -fuzz=FuzzClientIP -fuzztime=200000x -fuzzminimizetime=5s ./internal/auth
      - run: go test -fuzz=FuzzParseTrustedProxies -fuzztime=600000x -fuzzminimizetime=5s ./internal/config
      - run: go test -fuzz=FuzzValidateName -fuzztime=400000x -fuzzminimizetime=5s ./internal/branding
      - run: go test -fuzz=FuzzNormalizePNG -fuzztime=50000x -fuzzminimizetime=5s ./internal/branding

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore

  postgres:
    name: Go tests (PostgreSQL)
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      # Same suite, real Postgres: each test gets its own schema (internal/testdb).
      - name: Tests against PostgreSQL
        env:
          KY_TEST_POSTGRES_DSN: postgres://ci:ci@127.0.0.1:5432/ci_test?sslmode=disable
        run: go test -race -timeout=30m -count=1 ./...

  s3:
    # The S3 attachment backend against a real signature-checking, versioned server.
    name: Go tests (versioned S3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KY_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      KY_TEST_S3_BUCKET: kymessages-ci
      KY_TEST_S3_ACCESS_KEY: kymessages-ci
      KY_TEST_S3_SECRET_KEY: kymessages-ci-fixture-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Start disposable versioned S3 server
        run: |
          docker run -d --name s3 --memory=512m --memory-swap=512m --cpus=1 --pids-limit=256 \
            -p 127.0.0.1:8333:8333 -v "$PWD/.github/ci/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 1; done
          export AWS_ACCESS_KEY_ID="$KY_TEST_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$KY_TEST_S3_SECRET_KEY" AWS_DEFAULT_REGION=us-east-1
          aws --endpoint-url "$KY_TEST_S3_ENDPOINT" s3api create-bucket --bucket "$KY_TEST_S3_BUCKET"
          aws --endpoint-url "$KY_TEST_S3_ENDPOINT" s3api put-bucket-versioning --bucket "$KY_TEST_S3_BUCKET" --versioning-configuration Status=Enabled
      - run: go test -race -count=1 -run 'S3' ./internal/blobs/
      - if: failure()
        run: docker logs s3

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned wasm-bindgen
        working-directory: web/crypto
        run: cargo +1.99.0 install --locked wasm-bindgen-cli --version 0.2.130
      - run: npm ci
        working-directory: web

      - name: Tests
        run: npm test
        working-directory: web

      - name: Typecheck and build
        run: npm run build
        working-directory: web

      # web/dist is embedded into the Go binary, so a stale commit ships a stale UI. Status, not
      # diff: a new hashed bundle is an untracked file, which git diff never reports.
      - name: Committed web/dist matches source
        run: |
          dirty="$(git status --porcelain -- web/dist)"
          if [ -n "$dirty" ]; then printf '%s\n' "$dirty"; exit 1; fi

      # The bot device bundle (E4): shared vectors, trust, and Olm/Megolm with web/crypto's core.
      - name: Bot bundle (Python)
        env:
          KYBOT_REQUIRE_INTEROP: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/kybot"
          "$RUNNER_TEMP/kybot/bin/pip" install --only-binary=:all: -r agent-skill/kymessages/scripts/requirements.txt
          "$RUNNER_TEMP/kybot/bin/python" -B -m unittest discover -s agent-skill/tests -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: web

  crypto:
    name: Crypto core (Rust/WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # rust-toolchain.toml pins the compiler and the wasm32 target; rustup installs them.
      - name: wasm-bindgen-cli
        run: cargo +1.99.0 install --locked wasm-bindgen-cli --version 0.2.130

      - name: Tests (wasm under Node)
        run: cargo test --locked

      - name: Clippy
        run: rustup component add clippy && cargo clippy --locked --all-targets -- -D warnings

      # Generated JS/types must match; the untracked WASM is built from this source.
      - name: Committed web/src/crypto/pkg matches source
        run: |
          ./build.sh
          dirty="$(git status --porcelain -- ../src/crypto/pkg)"
          if [ -n "$dirty" ]; then printf '%s\n' "$dirty"; git diff --stat -- ../src/crypto/pkg; exit 1; fi

  pqc:
    name: PQC core (Go/WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build with go.mod's pinned Go and its matching wasm_exec.js.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The same tests and shared vectors as the native build, compiled to js/wasm under Node.
      - name: Tests (js/wasm under Node)
        run: PATH="$(go env GOROOT)/lib/wasm:$PATH" GOOS=js GOARCH=wasm go test -count=1 ./internal/e2eeid/ github.com/Busnes-app/ky-primitives/xwing github.com/Busnes-app/ky-primitives/hybridsig

      # Build shared command + product adapter; generated WASM must stay out of git.
      - name: Build pqwasm from the pinned module
        run: |
          bash scripts/build-pqwasm.sh
          test -z "$(git ls-files '*.wasm')"
          dirty="$(git status --porcelain -- web/src/pqc)"
          if [ -n "$dirty" ]; then printf '%s\n' "$dirty"; git diff --stat -- web/src/pqc; exit 1; fi

  browser:
    name: Browser regressions (production server)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: go build -o .browser/server ./cmd/server
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: web/test-results/
          retention-days: 7

  security:
    name: Vulnerability scan
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  smoke:
    name: End-to-end smoke test
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      - run: shellcheck scripts/*.sh
      - run: go build -o kymessages ./cmd/server
      - run: scripts/smoke-test.sh
      - run: python3 scripts/backup-acceptance.py

  docker:
    name: Docker image build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t kymessages:ci .
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Image is a release build (no kye2e tag, refuses multi mode)
        run: bash scripts/check-release-build.sh kymessages:ci

      - name: Container serves the app
        run: |
          docker run -d --name ky_ci -p 18080:8080 \
            -e KY_ADMIN_PASSWORD='CiSmokeAdminPass123!' \
            -e KY_CAPTCHA_PROVIDER=none \
            -e KY_PUSH_ENABLED=false -e PUSH_RELAY_URL= -e APNS_RELAY_URL= \
            kymessages:ci
          trap 'docker logs ky_ci; docker rm -f ky_ci' EXIT

          curl -sf -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/
          curl -sf -o /dev/null http://127.0.0.1:18080/api/settings
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CiSmokeAdminPass123!"}' \
            http://127.0.0.1:18080/api/auth/login | grep -q '"authenticated":true'
