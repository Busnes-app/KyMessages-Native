[package]
name = "kymessages-crypto"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.11.2", features = ["wasm_js"] }
wasm-bindgen = "=0.2.130"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"
